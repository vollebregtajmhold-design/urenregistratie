<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Urenregistratie</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F0F6FB;--surface:#FFFFFF;--border:#C8DFF0;--text:#1A2A38;
    --muted:#6B8EAA;--accent:#2C7BB5;--accent-light:#DBF0FF;
    --danger:#C0392B;--success:#1A6B3C;--warn:#8A5A00;--warn-bg:#FFF8E6;
    --radius:10px;--font:'Inter',system-ui,sans-serif;
  }
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100vh}
  .screen{display:none;max-width:480px;margin:0 auto;padding:1.5rem 1rem 4rem}
  .screen.active{display:block}
  .logo{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}
  .page-title{font-size:24px;font-weight:600;margin-bottom:2rem}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem}
  label{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem;margin-top:1rem}
  label:first-child{margin-top:0}
  input,select{display:block;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px;font-family:var(--font);outline:none;transition:border-color .15s}
  input:focus,select:focus{border-color:var(--accent)}
  input:disabled{opacity:.5;cursor:not-allowed}
  .btn{display:block;width:100%;padding:12px;border-radius:8px;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;text-align:center;transition:opacity .15s,transform .1s;border:none;margin-top:1rem}
  .btn:active{transform:scale(.98);opacity:.85}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn-sm{padding:7px 12px;font-size:13px;width:auto;display:inline-block;margin-top:0}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .error{font-size:13px;color:var(--danger);margin-top:.5rem}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
  .logout{background:none;border:none;cursor:pointer;font-size:13px;color:var(--muted);font-family:var(--font);padding:4px 0}
  .logout:hover{color:var(--text)}
  .tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.25rem;overflow-x:auto}
  .tab{padding:10px 0;margin-right:1.5rem;font-size:14px;font-weight:500;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;font-family:var(--font);transition:color .15s;white-space:nowrap}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tabpanel{display:none}.tabpanel.active{display:block}
  .week-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1rem;overflow:hidden}
  .week-header{padding:10px 14px;background:var(--accent-light);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .week-title{font-weight:600;font-size:14px;color:var(--accent)}
  .week-totals{font-size:12px;color:var(--muted)}
  .week-body{padding:0}
  .entry{border-bottom:1px solid var(--border);padding:10px 0}
  .entry:last-child{border-bottom:none}
  .empty{text-align:center;padding:3rem 0;color:var(--muted);font-size:14px}
  .filter-row{display:flex;gap:8px;margin-bottom:1rem;align-items:center}
  .filter-row select{margin:0;flex:1}
  .filter-row label{margin:0;white-space:nowrap;font-size:12px}
  .user-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
  .user-row:last-child{border-bottom:none}
  .hint{font-size:12px;color:var(--muted);margin-top:.4rem}
  .success-msg{font-size:13px;color:var(--success);margin-top:.5rem;font-weight:500}
  .lock-notice{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:1rem}
  .person-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:.75rem}
  .person-header{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-bottom:1px solid var(--border)}
  .person-name{font-weight:600;font-size:15px}
  .person-toggle{font-size:13px;color:var(--muted)}
  .person-body{padding:0}
  .loading{text-align:center;padding:2rem;color:var(--muted);font-size:14px}
  .stat{background:var(--accent-light);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem;text-align:center}
  .stat-val{font-size:20px;font-weight:600;color:var(--accent)}
  .stat-lbl{font-size:11px;color:var(--muted);margin-top:2px}
  /* Tabel */
  .uren-table-wrap{width:100%;overflow:hidden}
  .uren-table{width:100%;border-collapse:collapse;table-layout:fixed}
  .uren-table col.c-datum{width:22%}
  .uren-table col.c-tijd{width:19%}
  .uren-table col.c-num{width:11.8%}
  .uren-table th{background:var(--accent-light);color:var(--accent);font-weight:600;font-size:10px;padding:6px 3px;text-align:right;white-space:nowrap;border-bottom:2px solid var(--border);overflow:hidden}
  .uren-table th.left{text-align:left;padding-left:6px}
  .uren-table td{font-size:11px;padding:6px 3px;border-bottom:1px solid var(--border);text-align:right;overflow:hidden;white-space:nowrap}
  .uren-table td.left{text-align:left;padding-left:6px}
  .uren-table tr:last-child td{border-bottom:none}
  .uren-table tr.totaalrij td{font-weight:700;font-size:11px;background:var(--accent-light);color:var(--accent);border-top:2px solid var(--border);border-bottom:none;padding:6px 3px}
  .uren-table tr.totaalrij td.left{padding-left:6px}
  .uren-table td.zero{color:var(--muted)}
  @media(prefers-color-scheme:dark){
    .tag.ziek{background:#3A1A18;color:#E57373}
    .tag.vrij{background:#0E2A1A;color:#66BB8A}
  }
</style>
</head>
<body>

<!-- LADEN -->
<div id="screen-loading" class="screen active">
  <div style="padding-top:4rem;text-align:center">
    <div class="logo" style="justify-content:center;display:block">Urenregistratie</div>
    <p style="margin-top:1rem;color:var(--muted)">Verbinden...</p>
  </div>
</div>

<!-- LOGIN -->
<div id="screen-login" class="screen">
  <div style="padding-top:2.5rem">
    <div class="logo">Urenregistratie</div>
    <div class="page-title">Inloggen</div>
    <div class="card">
      <label>Naam</label>
      <input type="text" id="login-name" placeholder="Uw naam" autocomplete="username">
      <label>Wachtwoord</label>
      <input type="password" id="login-pass" placeholder="Wachtwoord" autocomplete="current-password">
      <div id="login-err" class="error" style="display:none"></div>
      <button class="btn btn-primary" onclick="doLogin()">Inloggen</button>
      <button class="btn btn-secondary" onclick="show('screen-register')">Account aanmaken</button>
    </div>
  </div>
</div>

<!-- REGISTER -->
<div id="screen-register" class="screen">
  <div class="topbar">
    <div class="logo">Urenregistratie</div>
    <button class="logout" onclick="show('screen-login')">← Terug</button>
  </div>
  <div class="page-title">Account aanmaken</div>
  <div class="card">
    <label>Uw naam</label>
    <input type="text" id="reg-name" placeholder="Volledige naam" autocomplete="name">
    <label>Wachtwoord</label>
    <input type="password" id="reg-pass" placeholder="Kies een wachtwoord" autocomplete="new-password">
    <div id="reg-err" class="error" style="display:none"></div>
    <button class="btn btn-primary" onclick="doRegister()">Account aanmaken</button>
  </div>
</div>

<!-- MEDEWERKER -->
<div id="screen-user" class="screen">
  <div class="topbar">
    <div>
      <div class="logo">Urenregistratie</div>
      <span id="user-name-label" style="font-weight:600;font-size:16px"></span>
    </div>
    <button class="logout" onclick="doLogout()">Uitloggen</button>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('user','invullen',this)">Invullen</button>
    <button class="tab" onclick="switchTab('user','weekoverzicht',this)">Weekoverzicht</button>
  </div>
  <div id="user-invullen" class="tabpanel active">
    <div id="lock-notice" class="lock-notice" style="display:none">🔒 Deze dag is definitief en kan niet meer worden aangepast.</div>
    <div class="card">
      <label>Datum <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:11px">(max. 6 dagen terug)</span></label>
      <input type="date" id="u-datum" onchange="onDatumChange()">
      <div class="row2">
        <div><label>Aanvang</label><input type="time" id="u-aanvang"></div>
        <div><label>Einde</label><input type="time" id="u-einde"></div>
      </div>
      <label>Gewerkte uren</label>
      <input type="number" id="u-gewerkt" min="0" max="24" step="0.5" placeholder="0">
      <label>Uren ziek</label>
      <input type="number" id="u-ziek" min="0" max="24" step="0.5" placeholder="0">
      <label>Uren dokter</label>
      <input type="number" id="u-dokter" min="0" max="24" step="0.5" placeholder="0">
      <label>Betaald vrij / feestdag</label>
      <input type="number" id="u-vrij" min="0" max="24" step="0.5" placeholder="0">
      <div id="u-err" class="error" style="display:none"></div>
      <div id="u-ok" class="success-msg" style="display:none"></div>
      <button class="btn btn-primary" id="btn-opslaan" onclick="saveEntry()">Opslaan</button>
    </div>
  </div>
  <div id="user-weekoverzicht" class="tabpanel">
    <div id="user-snipper-summary"></div>
    <div id="user-week-list"><div class="loading">Laden...</div></div>
  </div>
</div>

<!-- ADMIN -->
<div id="screen-admin" class="screen">
  <div class="topbar">
    <div>
      <div class="logo">Urenregistratie</div>
      <span style="font-weight:600;font-size:16px">Beheerder</span>
    </div>
    <button class="logout" onclick="doLogout()">Uitloggen</button>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('admin','weekoverzicht',this)">Weekoverzicht</button>
    <button class="tab" onclick="switchTab('admin','jaaroverzicht',this)">Jaaroverzicht</button>
    <button class="tab" onclick="switchTab('admin','details',this)">Details</button>
    <button class="tab" onclick="switchTab('admin','mensen',this)">Medewerkers</button>
  </div>
  <div id="admin-weekoverzicht" class="tabpanel active">
    <div class="filter-row">
      <label>Week</label>
      <select id="f-week" onchange="renderAdmin()"><option value="">Alle weken</option></select>
    </div>
    <div id="admin-week-list"><div class="loading">Laden...</div></div>
  </div>
  <div id="admin-jaaroverzicht" class="tabpanel">
    <div class="filter-row">
      <label>Jaar</label>
      <select id="f-jaar" onchange="renderJaaroverzicht()"><option value="">Huidig jaar</option></select>
      <label>Medewerker</label>
      <select id="f-jaar-naam" onchange="renderJaaroverzicht()"><option value="">Alle</option></select>
    </div>
    <div id="jaar-list"></div>
  </div>
  <div id="admin-details" class="tabpanel">
    <div class="filter-row">
      <label>Naam</label>
      <select id="f-naam" onchange="renderAdmin()"><option value="">Alle medewerkers</option></select>
      <label>Week</label>
      <select id="f-week2" onchange="renderAdmin()"><option value="">Alle weken</option></select>
    </div>
    <div id="admin-list"></div>
  </div>
  <div id="admin-mensen" class="tabpanel">
    <div id="admin-users-list" class="card" style="padding:.75rem 1rem"></div>
    <div class="card" style="margin-top:1rem">
      <div style="font-weight:600;margin-bottom:.75rem">Medewerker toevoegen</div>
      <label>Naam</label>
      <input type="text" id="new-naam" placeholder="Naam">
      <label>Wachtwoord</label>
      <input type="password" id="new-pass" placeholder="Wachtwoord">
      <label>Contracturen per week</label>
      <input type="number" id="new-contract" min="0" max="60" step="0.5" placeholder="bijv. 40">
      <div id="new-err" class="error" style="display:none"></div>
      <button class="btn btn-primary" onclick="addUser()">Toevoegen</button>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDha05hLJuL1O-4cjcCOdutdQmbUPXGN4Q",
  authDomain: "urenregistratie-416e5.firebaseapp.com",
  projectId: "urenregistratie-416e5",
  storageBucket: "urenregistratie-416e5.firebasestorage.app",
  messagingSenderId: "324133291974",
  appId: "1:324133291974:web:e185a51b03a86e15ced4c7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let me = null;
let allEntries = [];
let allUsers = [];

// --- Init ---
async function init() {
  await loadUsers();
  // Zorg voor admin account
  if (!allUsers.find(u => u.name === 'admin')) {
    await setDoc(doc(db, 'users', 'admin'), { name: 'admin', pass: 'admin123', role: 'admin' });
    await loadUsers();
  }
  show('screen-login');
}

async function loadUsers() {
  const snap = await getDocs(collection(db, 'users'));
  allUsers = snap.docs.map(d => d.data());
}

async function loadEntries() {
  const snap = await getDocs(query(collection(db, 'entries'), orderBy('datum', 'desc')));
  allEntries = snap.docs.map(d => d.data());
}

// --- Auth ---
window.doLogin = async function() {
  const n = val('login-name').trim().toLowerCase();
  const p = val('login-pass');
  const u = allUsers.find(x => x.name.toLowerCase() === n && x.pass === p);
  if (!u) { showErr('login-err', 'Naam of wachtwoord onjuist'); return; }
  hideEl('login-err');
  me = u;
  await loadEntries();
  if (u.role === 'admin') {
    show('screen-admin');
    fillFilters(); renderAdmin();
  } else {
    document.getElementById('user-name-label').textContent = u.name;
    initEntryForm(todayStr());
    show('screen-user');
    resetUserTabs();
  }
};

window.doRegister = async function() {
  const n = val('reg-name').trim();
  const p = val('reg-pass');
  if (!n || !p) { showErr('reg-err', 'Vul naam en wachtwoord in'); return; }
  if (allUsers.find(u => u.name.toLowerCase() === n.toLowerCase())) { showErr('reg-err', 'Naam al in gebruik'); return; }
  await setDoc(doc(db, 'users', n.toLowerCase()), { name: n, pass: p, role: 'user' });
  await loadUsers();
  hideEl('reg-err');
  alert('Account aangemaakt! U kunt nu inloggen.');
  show('screen-login');
};

window.doLogout = function() {
  me = null; allEntries = [];
  setVal('login-name',''); setVal('login-pass','');
  show('screen-login');
};

// --- Entry opslaan ---
window.saveEntry = async function() {
  const datum = val('u-datum');
  if (!datum) { showErr('u-err', 'Selecteer een datum'); return; }
  if (isLocked(datum)) { showErr('u-err', 'Deze dag is definitief'); return; }
  hideEl('u-err');
  const btn = document.getElementById('btn-opslaan');
  btn.textContent = 'Opslaan...'; btn.disabled = true;
  const rec = {
    naam: me.name, datum,
    aanvang: val('u-aanvang'), einde: val('u-einde'),
    gewerkt: parseFloat(val('u-gewerkt')) || 0,
    ziek:    parseFloat(val('u-ziek'))    || 0,
    dokter:  parseFloat(val('u-dokter'))  || 0,
    vrij:    parseFloat(val('u-vrij'))    || 0
  };
  const id = me.name.toLowerCase().replace(/\s+/g,'-') + '_' + datum;
  await setDoc(doc(db, 'entries', id), rec);
  await loadEntries();
  btn.textContent = 'Opslaan'; btn.disabled = false;
  const okEl = document.getElementById('u-ok');
  okEl.textContent = '✓ Opgeslagen voor ' + fmtDate(datum);
  okEl.style.display = 'block';
  setTimeout(() => okEl.style.display = 'none', 3000);
};

// --- Admin medewerkers ---
window.addUser = async function() {
  const n = val('new-naam').trim();
  const p = val('new-pass');
  const c = parseFloat(document.getElementById('new-contract').value) || 0;
  if (!n || !p) { showErr('new-err', 'Vul naam en wachtwoord in'); return; }
  if (allUsers.find(u => u.name.toLowerCase() === n.toLowerCase())) { showErr('new-err', 'Naam al in gebruik'); return; }
  await setDoc(doc(db, 'users', n.toLowerCase().replace(/\s+/g,'-')), { name: n, pass: p, role: 'user', contracturen: c });
  await loadUsers();
  setVal('new-naam',''); setVal('new-pass',''); document.getElementById('new-contract').value = '';
  hideEl('new-err');
  renderAdmin();
};

window.saveContract = async function(name) {
  const c = parseFloat(document.getElementById('contract-' + name).value) || 0;
  const key = name.toLowerCase().replace(/\s+/g,'-');
  const u = allUsers.find(x => x.name === name);
  if (!u) return;
  await setDoc(doc(db, 'users', key), { ...u, contracturen: c });
  await loadUsers();
  renderAdmin();
  alert(`Contracturen voor ${name} opgeslagen: ${c}u/week`);
};

window.deleteUser = async function(name) {
  if (!confirm(`Medewerker "${name}" verwijderen?`)) return;
  await deleteDoc(doc(db, 'users', name.toLowerCase().replace(/\s+/g,'-')));
  await loadUsers();
  renderAdmin();
};

// --- Render ---
window.renderUserWeek = function() {
  const mine = allEntries.filter(e => e.naam === me.name);
  const el = document.getElementById('user-week-list');
  const contract = me.contracturen || 0;
  const curYear = new Date().getFullYear().toString();

  // Snipperuren samenvatting
  const summary = document.getElementById('user-snipper-summary');
  if (contract > 0) {
    const weken = groupByWeek(mine);
    let snipperHtml = '<div class="card" style="margin-bottom:1rem">';
    snipperHtml += `<div style="font-weight:600;margin-bottom:.75rem">Snipperuren overzicht</div>`;

    // Per jaar
    const jaarEntries = mine.filter(e => e.datum.startsWith(curYear));
    const jaarWeken = groupByWeek(jaarEntries);
    const jaarContract = jaarWeken.length * contract;
    const jaarTot = totals(jaarEntries);
    const jaarGebruikt = +(jaarTot.g||0)+ +(jaarTot.z||0)+ +(jaarTot.d||0)+ +(jaarTot.v||0);
    const jaarSnipper = +(jaarContract - jaarGebruikt).toFixed(1);
    snipperHtml += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:.5rem">
      <div class="stat"><div class="stat-val">${contract}</div><div class="stat-lbl">Contract/week</div></div>
      <div class="stat"><div class="stat-val">${jaarGebruikt}</div><div class="stat-lbl">Gebruikt ${curYear}</div></div>
      <div class="stat"><div class="stat-val" style="color:${jaarSnipper>=0?'var(--success)':'var(--danger)'}">${jaarSnipper}</div><div class="stat-lbl">Snipper ${curYear}</div></div>
    </div>`;
    snipperHtml += '</div>';
    summary.innerHTML = snipperHtml;
  } else {
    summary.innerHTML = '';
  }

  if (!mine.length) { el.innerHTML = '<div class="empty">Nog geen uren geregistreerd</div>'; return; }
  const weken = groupByWeek(mine);
  el.innerHTML = `<div class="uren-table-wrap"><table class="uren-table">
    <colgroup><col style="width:28%"><col class="c-num"><col class="c-num"><col class="c-num"><col class="c-num"><col class="c-num">${contract>0?'<col class="c-num">':''}</colgroup>
    <thead><tr><th class="left">Week</th><th>Gew.</th><th>Ziek</th><th>Dok.</th><th>Vrij</th><th>Tot.</th>${contract>0?'<th>Snip.</th>':''}</tr></thead>
    <tbody>
    ${weken.map(({label, items, key}) => {
      const t = totals(items);
      const tot = +(t.g||0)+ +(t.z||0)+ +(t.d||0)+ +(t.v||0);
      const snip = contract > 0 ? +(contract - tot).toFixed(1) : null;
      const snipperCell = contract > 0 ? `<td style="color:${snip>=0?'var(--success)':'var(--danger)'};font-weight:600">${snip}</td>` : '';
      return `<tr class="week-row" onclick="toggleWeekDetail('${key}')" style="cursor:pointer">
        <td class="left">${label} ▾</td>
        <td>${t.g||'–'}</td><td>${t.z>0?t.z:'–'}</td><td>${t.d>0?t.d:'–'}</td><td>${t.v>0?t.v:'–'}</td>
        <td><b>${tot>0?tot.toFixed(1):'–'}</b></td>${snipperCell}
      </tr>
      <tr id="detail-${key}" style="display:none"><td colspan="${contract>0?7:6}" style="padding:0">${weekTable(items)}</td></tr>`;
    }).join('')}
    </tbody>
  </table></div>`;
};

window.toggleWeekDetail = function(key) {
  const el = document.getElementById('detail-' + key);
  if (el) el.style.display = el.style.display === 'none' ? 'table-row' : 'none';
};

window.renderJaaroverzicht = function() {
  // Vul jaar-filter
  const jaren = [...new Set(allEntries.map(e => e.datum.substring(0,4)))].sort().reverse();
  const jaarSel = document.getElementById('f-jaar');
  const naamSel = document.getElementById('f-jaar-naam');
  const curJaar = jaarSel.value || new Date().getFullYear().toString();
  const curNaam = naamSel.value;
  jaarSel.innerHTML = jaren.map(j => `<option ${j===curJaar?'selected':''} value="${j}">${j}</option>`).join('');
  const namen = [...new Set(allEntries.map(e => e.naam))].sort();
  naamSel.innerHTML = '<option value="">Alle medewerkers</option>' + namen.map(n => `<option ${n===curNaam?'selected':''} value="${n}">${n}</option>`).join('');

  const filtered = allEntries.filter(e => e.datum.startsWith(curJaar) && (!curNaam || e.naam === curNaam));
  const el = document.getElementById('jaar-list');
  if (!filtered.length) { el.innerHTML = '<div class="empty">Geen registraties gevonden</div>'; return; }

  // Groepeer per medewerker
  const namen2 = curNaam ? [curNaam] : [...new Set(filtered.map(e => e.naam))].sort();
  el.innerHTML = namen2.map(naam => {
    const pEntries = filtered.filter(e => e.naam === naam);
    const weken = groupByWeek(pEntries);
    const jaarTot = totals(pEntries);
    const rows = weken.map(({label, items}) => {
      const t = totals(items);
      const tot = +(t.g||0)+ +(t.z||0)+ +(t.d||0)+ +(t.v||0);
      return `<tr>
        <td class="left">${label}</td>
        <td>${t.g||'–'}</td>
        <td>${t.z>0?t.z:'–'}</td>
        <td>${t.d>0?t.d:'–'}</td>
        <td>${t.v>0?t.v:'–'}</td>
        <td><b>${tot>0?tot.toFixed(1):'–'}</b></td>
      </tr>`;
    }).join('');
    const jTot = +(jaarTot.g||0)+ +(jaarTot.z||0)+ +(jaarTot.d||0)+ +(jaarTot.v||0);
    return `<div class="week-block" style="margin-bottom:1.25rem">
      <div class="week-header">
        <span class="week-title">${naam}</span>
        <span class="week-totals">${curJaar} · ${jaarTot.g}u gewerkt</span>
      </div>
      <div class="uren-table-wrap">
        <table class="uren-table">
          <colgroup><col style="width:32%"><col class="c-num"><col class="c-num"><col class="c-num"><col class="c-num"><col class="c-num"></colgroup>
          <thead><tr>
            <th class="left">Week</th><th>Gew.</th><th>Ziek</th><th>Dok.</th><th>Vrij</th><th>Tot.</th>
          </tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr class="totaalrij">
            <td class="left">Jaartotaal</td>
            <td>${jaarTot.g||'–'}</td>
            <td>${jaarTot.z>0?jaarTot.z:'–'}</td>
            <td>${jaarTot.d>0?jaarTot.d:'–'}</td>
            <td>${jaarTot.v>0?jaarTot.v:'–'}</td>
            <td><b>${jTot>0?jTot.toFixed(1):'–'}</b></td>
          </tr></tfoot>
        </table>
      </div>
    </div>`;
  }).join('');
};

window.renderAdmin = function() {
  fillFilters();
  const week  = document.getElementById('f-week')  ? document.getElementById('f-week').value  : '';
  const naam  = document.getElementById('f-naam')  ? document.getElementById('f-naam').value  : '';
  const week2 = document.getElementById('f-week2') ? document.getElementById('f-week2').value : '';

  // Weekoverzicht
  const nonAdminNames = [...new Set(allEntries.map(e => e.naam))].sort();
  const allWeeks = [...new Set(allEntries.map(e => weekKey(e.datum)))].sort().reverse();
  const weeksToShow = week ? [week] : allWeeks;
  let weekHtml = '';
  if (!allEntries.length) {
    weekHtml = '<div class="empty">Nog geen registraties</div>';
  } else {
    weeksToShow.forEach(wk => {
      const wkEntries = allEntries.filter(e => weekKey(e.datum) === wk);
      if (!wkEntries.length) return;
      let personHtml = '';
      nonAdminNames.forEach(n => {
        const pe = wkEntries.filter(e => e.naam === n);
        if (!pe.length) return;
        const tot = totals(pe);
        personHtml += `<div class="person-block" style="margin:8px 0">
          <div class="person-header" onclick="togglePerson(this)">
            <span class="person-name">${n}</span>
            <span class="person-toggle">${tot.g}u ▾</span>
          </div>
          <div class="person-body" style="display:none">${weekTable(pe)}</div>
        </div>`;
      });
      if (personHtml) {
        weekHtml += `<div class="week-block">
          <div class="week-header" onclick="toggleWeek(this)">
            <span class="week-title">${weekLabel(wkEntries[0].datum)}</span>
            <span class="week-totals">${wkEntries.length} registratie${wkEntries.length!==1?'s':''}</span>
          </div>
          <div class="week-body">${personHtml}</div>
        </div>`;
      }
    });
    if (!weekHtml) weekHtml = '<div class="empty">Geen registraties gevonden</div>';
  }
  document.getElementById('admin-week-list').innerHTML = weekHtml;

  // Details
  let filtered = allEntries.filter(e => {
    if (naam && e.naam !== naam) return false;
    if (week2 && weekKey(e.datum) !== week2) return false;
    return true;
  });
  document.getElementById('admin-list').innerHTML = filtered.length
    ? '<div class="card" style="padding:.75rem 1rem">' + filtered.map(e => `
        <div class="entry" style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;justify-content:space-between">
            <b>${e.naam}</b><span style="font-size:13px;color:var(--muted)">${fmtDate(e.datum)} · ${weekLabel(e.datum)}</span>
          </div>
          <div style="font-size:13px;color:var(--muted);margin-top:3px">${e.aanvang||'–'} – ${e.einde||'–'} · ${e.gewerkt}u gewerkt
            ${e.ziek ? ` · ${e.ziek}u ziek` : ''}${e.dokter ? ` · ${e.dokter}u dokter` : ''}${e.vrij ? ` · ${e.vrij}u vrij` : ''}
          </div>
        </div>`).join('') + '</div>'
    : '<div class="empty">Geen registraties gevonden</div>';

  // Medewerkers
  const nonAdmin = allUsers.filter(u => u.role !== 'admin');
  document.getElementById('admin-users-list').innerHTML = nonAdmin.length
    ? nonAdmin.map(u => `<div class="user-row">
        <div>
          <span style="font-weight:500">${u.name}</span>
          <span style="font-size:12px;color:var(--muted);margin-left:8px">${u.contracturen||0}u/week</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="number" min="0" max="60" step="0.5" value="${u.contracturen||0}" 
            style="width:60px;padding:4px 6px;font-size:13px;margin:0" 
            id="contract-${u.name}" placeholder="uren">
          <button class="btn btn-secondary btn-sm" onclick="saveContract('${u.name}')">✓</button>
          <button class="btn btn-secondary btn-sm" onclick="deleteUser('${u.name}')">✕</button>
        </div>
      </div>`).join('')
    : '<p style="color:var(--muted);font-size:14px">Nog geen medewerkers</p>';
};

function fillFilters() {
  const names = [...new Set(allEntries.map(e => e.naam))].sort();
  const weeks = [...new Set(allEntries.map(e => weekKey(e.datum)))].sort().reverse();
  const nSel = document.getElementById('f-naam');
  if (nSel) { const c=nSel.value; nSel.innerHTML='<option value="">Alle medewerkers</option>'+names.map(n=>`<option ${n===c?'selected':''} value="${n}">${n}</option>`).join(''); }
  ['f-week','f-week2'].forEach(id => {
    const s = document.getElementById(id); if (!s) return;
    const c = s.value;
    s.innerHTML = '<option value="">Alle weken</option>' + weeks.map(w => {
      const e = allEntries.find(x => weekKey(x.datum) === w);
      return `<option ${w===c?'selected':''} value="${w}">${e ? weekLabel(e.datum) : w}</option>`;
    }).join('');
  });
}

// --- Helpers ---
window.switchTab = function(scope, tab, btn) {
  document.querySelectorAll(`#screen-${scope} .tabpanel`).forEach(p => p.classList.remove('active'));
  document.querySelectorAll(`#screen-${scope} .tab`).forEach(t => t.classList.remove('active'));
  document.getElementById(`${scope}-${tab}`).classList.add('active');
  btn.classList.add('active');
  if (scope === 'user' && tab === 'weekoverzicht') renderUserWeek();
  if (scope === 'admin' && tab === 'jaaroverzicht') renderJaaroverzicht();
  if (scope === 'admin' && tab !== 'jaaroverzicht') renderAdmin();
};

window.onDatumChange = function() {
  const datum = val('u-datum');
  const locked = isLocked(datum);
  document.getElementById('lock-notice').style.display = locked ? 'block' : 'none';
  ['u-aanvang','u-einde','u-gewerkt','u-ziek','u-dokter','u-vrij'].forEach(id => document.getElementById(id).disabled = locked);
  document.getElementById('btn-opslaan').disabled = locked;
  if (datum) {
    const ex = allEntries.find(e => e.naam === me.name && e.datum === datum);
    if (ex) { setVal('u-aanvang',ex.aanvang||''); setVal('u-einde',ex.einde||''); setVal('u-gewerkt',ex.gewerkt||''); setVal('u-ziek',ex.ziek||''); setVal('u-dokter',ex.dokter||''); setVal('u-vrij',ex.vrij||''); }
    else { setVal('u-aanvang','08:00'); setVal('u-einde','17:00'); ['u-gewerkt','u-ziek','u-dokter','u-vrij'].forEach(id=>setVal(id,'')); }
  }
};

window.toggleWeek = function(h) { const b=h.nextElementSibling; b.style.display=b.style.display==='none'?'block':'none'; };
window.togglePerson = function(h) { const b=h.nextElementSibling; b.style.display=b.style.display==='none'?'block':'none'; };

function initEntryForm(datum) {
  const inp = document.getElementById('u-datum');
  inp.value = datum; inp.min = minDate(); inp.max = todayStr();
  setVal('u-aanvang','08:00'); setVal('u-einde','17:00');
  ['u-gewerkt','u-ziek','u-dokter','u-vrij'].forEach(id=>setVal(id,''));
  onDatumChange();
}

function resetUserTabs() {
  document.querySelectorAll('#screen-user .tab').forEach((t,i)=>t.classList.toggle('active',i===0));
  document.getElementById('user-invullen').classList.add('active');
  document.getElementById('user-weekoverzicht').classList.remove('active');
}

function weekTable(items) {
  const tot = totals(items);
  const fmt = v => (v && v > 0) ? v : '<span class="zero">–</span>';
  const rows = items.slice().sort((a,b)=>a.datum.localeCompare(b.datum)).map(e => {
    const locked = isLocked(e.datum);
    const dag = +(e.gewerkt||0)+ +(e.ziek||0)+ +(e.dokter||0)+ +(e.vrij||0);
    return `<tr>
      <td class="left">${fmtDate(e.datum)}${locked?'🔒':''}</td>
      <td class="left">${(e.aanvang||'–').substring(0,5)}/${(e.einde||'–').substring(0,5)}</td>
      <td>${fmt(e.gewerkt)}</td><td>${fmt(e.ziek)}</td><td>${fmt(e.dokter)}</td><td>${fmt(e.vrij)}</td>
      <td><b>${dag>0?dag.toFixed(1):'–'}</b></td>
    </tr>`;
  }).join('');
  const totT = +(tot.g||0)+ +(tot.z||0)+ +(tot.d||0)+ +(tot.v||0);
  return `<div class="uren-table-wrap"><table class="uren-table">
    <colgroup><col class="c-datum"><col class="c-tijd"><col class="c-num"><col class="c-num"><col class="c-num"><col class="c-num"><col class="c-num"></colgroup>
    <thead><tr><th class="left">Datum</th><th class="left">Tijd</th><th>Gew.</th><th>Ziek</th><th>Dok.</th><th>Vrij</th><th>Tot.</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr class="totaalrij"><td class="left" colspan="2">Totaal</td>
      <td>${tot.g||'–'}</td><td>${tot.z>0?tot.z:'–'}</td><td>${tot.d>0?tot.d:'–'}</td><td>${tot.v>0?tot.v:'–'}</td>
      <td><b>${totT>0?totT.toFixed(1):'–'}</b></td>
    </tr></tfoot>
  </table></div>`;
}

function groupByWeek(list) {
  const map = {};
  list.forEach(e => { const k=weekKey(e.datum); if(!map[k])map[k]={key:k,label:weekLabel(e.datum),items:[]}; map[k].items.push(e); });
  return Object.values(map).sort((a,b)=>b.key.localeCompare(a.key));
}

function totals(items) {
  let g=0,z=0,d=0,v=0;
  items.forEach(e=>{g+=+(e.gewerkt||0);z+=+(e.ziek||0);d+=+(e.dokter||0);v+=+(e.vrij||0);});
  return {g:+g.toFixed(1),z:+z.toFixed(1),d:+d.toFixed(1),v:+v.toFixed(1)};
}

function todayStr(){return new Date().toISOString().split('T')[0];}
function minDate(){const d=new Date();d.setDate(d.getDate()-6);return d.toISOString().split('T')[0];}
function isLocked(datum){return datum<minDate();}
function getWeekNr(datum){const d=new Date(datum);const thu=new Date(d);thu.setDate(d.getDate()-((d.getDay()+6)%7)+3);const jan4=new Date(thu.getFullYear(),0,4);return Math.round((thu-jan4)/604800000)+1;}
function weekKey(datum){const d=new Date(datum);const thu=new Date(d);thu.setDate(d.getDate()-((d.getDay()+6)%7)+3);return `${thu.getFullYear()}-W${String(getWeekNr(datum)).padStart(2,'0')}`;}
function weekLabel(datum){return `Week ${getWeekNr(datum)} (${new Date(datum).getFullYear()})`;}
function fmtDate(d){const[y,m,day]=d.split('-');return `${day}-${m}-${y}`;}
window.show = function(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
window.val = function(id){return document.getElementById(id).value;}
window.setVal = function(id,v){document.getElementById(id).value=v;}
window.showErr = function(id,msg){const el=document.getElementById(id);el.textContent=msg;el.style.display='block';}
window.hideEl = function(id){document.getElementById(id).style.display='none';}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('screen-login').classList.contains('active'))doLogin();});

init();
</script>
